<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="../js/overlay-target.js?v=20261126"></script>
  <script>
    (function () {
      var target;
      var safe;
      try {
        target = window.PulsePlayDevice.miniHref(location.search, location.hash);
      } catch (e) {
        target = "pro.html" + (location.search || "");
        if (!/([?&])device=/.test(target)) {
          target += (target.indexOf("?") === -1 ? "?" : "&") + "device=pro";
        } else {
          target = target.replace(/([?&])device=[^&#]*/g, "$1device=pro");
        }
        if (location.hash) target += location.hash;
      }
      safe = String(target).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      document.write('<meta http-equiv="refresh" content="0;url=' + safe + '">');
      document.write('<link rel="canonical" href="' + safe + '">');
      location.replace(target);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YoloBox overlay</title>
  <noscript><meta http-equiv="refresh" content="0;url=pro.html"></noscript>
  <style>
    html, body { background: transparent; margin: 0; }
    body { font: 16px/1.45 Arial, Helvetica, sans-serif; color: #102018; }
    a {
      display: inline-block;
      min-height: 44px;
      min-width: 44px;
      padding: 12px 16px;
      font-size: 16px;
      line-height: 20px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <p><a id="pro-fallback" href="pro.html">Open the YoloBox Pro overlay</a></p>
  <script>
    (function () {
      var link = document.getElementById("pro-fallback");
      if (!link || !window.PulsePlayDevice) return;
      link.href = window.PulsePlayDevice.miniHref(location.search, location.hash);
    })();
  </script>
</body>
</html>
