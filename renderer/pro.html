<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="../js/overlay-target.js"></script>
  <script>
    (function () {
      if (!window.PulsePlayDevice || !window.PulsePlayDevice.proNeedsNormalize(location.search)) return;
      location.replace(window.PulsePlayDevice.proHref(location.pathname, location.search, location.hash));
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YoloBox Pro overlay</title>
  <style>html,body{background:transparent;margin:0;height:100%;overflow:hidden}</style>
  <link rel="stylesheet" href="overlay.css">
  <link rel="stylesheet" href="pro.css">
</head>
<body class="mode-logos-score" data-device="pro">
  <!--
    View 1 (#view-logos) and View 2 (#view-ad) both stay in the DOM.
    The script only toggles body classes mode-logos-score and mode-ad,
    and .is-active on the preloaded video for the ground's selected ad.
    It does not remove #score-frame, so the CricClubs overlay is not reloaded.
  -->
  <div id="stage" data-w="1920" data-h="1080">
    <div id="view-logos" class="view">
      <img id="logo-age" class="logo logo-age" alt="Age group sponsor">
      <img id="logo-tournament" class="logo logo-tournament" alt="Tournament">
      <img id="logo-ccusa" class="logo logo-ccusa" alt="CricketCrazeUSA">
      <div id="score-slot">
        <iframe id="score-frame" title="Match score" scrolling="no" referrerpolicy="no-referrer" allowtransparency="true"></iframe>
        <p id="score-fallback" class="is-off">
          <span>This score source blocks embedding.</span>
          <a id="score-fallback-link" target="_blank" rel="noopener">Open score</a>
        </p>
      </div>
    </div>
    <div id="view-ad" class="view">
      <div id="ad-slots"></div>
    </div>
    <div id="subscribe-ticker" aria-hidden="true">
      <div class="subscribe-ticker__track"><span id="subscribe-ticker-text"></span></div>
    </div>
    <p id="overlay-status" class="is-off"><span id="overlay-status-text"></span></p>
  </div>
  <script src="../config/runtime.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/supabase-store.js"></script>
  <script src="../js/score-frame.js"></script>
  <script src="../js/layout.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
